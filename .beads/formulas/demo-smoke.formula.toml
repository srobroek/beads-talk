# demo-smoke -- transient operational check; instantiate as a wisp:
#   bd mol wisp demo-smoke --var run=<run> --json
# Wisps are local and ephemeral. Record any durable conclusion on a regular bead.
formula = "demo-smoke"
description = "Transient Mardi Gras status observation for run {{run}}"
version = 1
type = "workflow"
phase = "vapor"

[vars.run]
description = "Run name, e.g. rehearsal-01"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"

[[steps]]
id = "inspect"
title = "inspect board {{run}}"
type = "task"
description = "Run `mg -status` once and observe ownership and dependency state. Transient: copy any conclusion worth keeping to a regular bead."

[steps.metadata]
execution_agent_type = "operator"
