# talk-delivery -- final acceptance, human approval, landing and ledger closeout
# for one demo feature. Pour one persistent molecule per run:
#   bd mol pour talk-delivery --var feature=log-summary-<run> --dry-run
#   bd mol pour talk-delivery --var feature=log-summary-<run> --json
# Formula steps carry no acceptance field in bd 1.3.0; the lead sets each
# step's acceptance after pouring (see README, "Delivery molecule").
formula = "talk-delivery"
description = "Deliver {{feature}}: independent acceptance, human approval gate, real PR landing, ledger closeout"
version = 1
type = "workflow"
phase = "liquid"

[vars.feature]
description = "Per-run feature identity, e.g. log-summary-rehearsal-01"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"

[[steps]]
id = "verify"
title = "verify {{feature}}"
type = "task"
description = "Independent read-only final acceptance on the exact delivery head: unittest discovery plus baseline, summary and filtered acceptance. Report APPROVE or REQUEST_CHANGES with the full 40-hex head SHA."

[steps.metadata]
execution_agent_type = "researcher"

[[steps]]
id = "approve"
title = "approve {{feature}}"
type = "task"
needs = ["verify"]
description = "Human acceptance of the current verified head and its evidence. Choosing this approval graph is not approval; only an interactive human decision resolves the gate."

[steps.metadata]
execution_agent_type = "operator"

[steps.gate]
type = "human"

[[steps]]
id = "land"
title = "land {{feature}}"
type = "task"
needs = ["approve"]
description = "Land the delivery PR with squash at the reviewed head; close only on a landing receipt proving MERGED, exact head, run base and merge SHA."

[steps.metadata]
execution_agent_type = "operator"

[[steps]]
id = "record"
title = "record {{feature}}"
type = "task"
needs = ["land"]
description = "Native ledger closeout: stamp pr and merge_sha, close children before parents with evidence, bd dolt push and confirm refs/dolt/data on the remote."

[steps.metadata]
execution_agent_type = "operator"
